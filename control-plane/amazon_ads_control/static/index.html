<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hermes Amazon Ads</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <section id="login" class="card login">
      <h1>Hermes Amazon Ads</h1>
      <p>确定性策略 · Executor 执行 · 独立验证 · 全程可追溯</p>
      <form id="login-form"><input id="password" type="password" autocomplete="current-password" placeholder="控制台密码" required><button>登录</button></form>
      <div id="login-error" class="error"></div>
    </section>

    <section id="app" hidden>
      <header>
        <div><h1>Amazon Ads 主控</h1><p id="generated">—</p></div>
        <div class="controls">
          <button data-mode="autopilot">自动运营</button>
          <button data-mode="observe">仅观察</button>
          <button data-mode="paused">暂停</button>
          <button id="refresh">刷新</button>
          <button id="logout" class="ghost">退出</button>
        </div>
      </header>

      <section class="status-strip">
        <span id="mode-pill">—</span>
        <span id="execution-pill">—</span>
        <span id="catalog-pill">—</span>
        <span id="alerts-pill">—</span>
      </section>

      <section id="kpis" class="kpis"></section>

      <nav id="tabs">
        <button class="active" data-tab="overview">总览</button>
        <button data-tab="decisions">决策</button>
        <button data-tab="changes">变更与验证</button>
        <button data-tab="alerts">异常</button>
        <button data-tab="profiles">Profiles / MCP</button>
      </nav>

      <section id="overview" class="tab active">
        <div class="grid two">
          <article class="card"><h2>最近周期</h2><div id="cycles"></div></article>
          <article class="card"><h2>任务与 Worker</h2><div id="tasks"></div><div id="workers"></div></article>
        </div>
        <article class="card"><h2>系统事件</h2><div id="events"></div></article>
      </section>

      <section id="decisions" class="tab"><article class="card"><h2>确定性策略决策</h2><div id="decision-list"></div></article></section>
      <section id="changes" class="tab"><article class="card"><h2>工具调用与结构化结果</h2><div id="actions"></div></article><article class="card"><h2>独立 Verifier 读回</h2><div id="verifications"></div></article></section>
      <section id="alerts" class="tab"><article class="card"><h2>需要关注</h2><div id="alert-list"></div></article></section>
      <section id="profiles" class="tab">
        <div class="grid two">
          <article class="card"><h2>广告 Profiles</h2><div id="profile-list"></div></article>
          <article class="card"><h2>核心策略</h2>
            <form id="strategy-form" class="strategy-form">
              <label>目标 ACOS %<input id="target-acos" type="number" min="1" step="0.1"></label>
              <label>最高 ACOS %<input id="max-acos" type="number" min="1" step="0.1"></label>
              <label>单次竞价最大变化 %<input id="max-bid-change" type="number" min="1" max="100"></label>
              <label>单次预算最大变化 %<input id="max-budget-change" type="number" min="1" max="100"></label>
              <button>保存策略</button><span id="strategy-message"></span>
            </form>
          </article>
        </div>
        <article class="card"><h2>Amazon Ads MCP 工具目录</h2><div id="catalog"></div><div id="catalog-tools"></div></article>
      </section>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
