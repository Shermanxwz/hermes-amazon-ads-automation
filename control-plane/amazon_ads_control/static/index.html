<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hermes Amazon Ads 主控台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header><div><h1>Hermes · Amazon Ads</h1><p>主控、Worker 与每日操作的透明控制面</p></div><span id="live" class="badge">连接中</span></header>
    <section id="login" class="card login"><h2>登录</h2><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="控制台密码" required><button>进入</button></form><p id="loginError"></p></section>
    <div id="app" hidden>
      <section class="grid metrics" id="metrics"></section>
      <section class="card controls"><div><h2>运行模式</h2><p>日志与操作记录只读；这里仅控制自动执行开关和硬性边界。</p></div><div class="control-row"><select id="mode"><option value="autopilot">AUTOPILOT</option><option value="observe">OBSERVE</option><option value="paused">PAUSED</option></select><label><input id="execution" type="checkbox">允许 Worker 写操作</label><button id="saveSettings">保存</button><button id="logout" class="ghost">退出</button></div></section>
      <section class="columns"><div class="card"><h2>任务</h2><div id="tasks"></div></div><div class="card"><h2>Workers</h2><div id="workers"></div></div></section>
      <section class="card"><h2>最近操作</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>角色</th><th>操作</th><th>工具</th><th>结果</th><th>任务</th></tr></thead><tbody id="actions"></tbody></table></div></section>
      <section class="card"><h2>事件流</h2><div id="events" class="timeline"></div></section>
    </div>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
