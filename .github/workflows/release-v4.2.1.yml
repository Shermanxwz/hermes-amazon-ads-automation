name: Release v4.2.1

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-v4.2.1
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Prove successful CI belongs to current main HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify sealed release identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re, tomllib
          root = pathlib.Path('.')
          version = tomllib.loads((root / 'pyproject.toml').read_text())['project']['version']
          manifest = json.loads((root / 'package-manifest.json').read_text())
          plugin = (root / 'hermes-plugin/amazon_ads_control/plugin.yaml').read_text()
          init_py = (root / 'control-plane/amazon_ads_control/__init__.py').read_text()
          expected = '4.2.1'
          checks = {
              'pyproject': version,
              'package-manifest': str(manifest.get('version')),
              'plugin': (re.search(r'^version:\s*([^\s]+)', plugin, re.M) or [None, ''])[1],
              '__version__': (re.search(r'__version__\s*=\s*["\']([^"\']+)', init_py) or [None, ''])[1],
          }
          bad = {k: v for k, v in checks.items() if v != expected}
          if bad:
              raise SystemExit(f'release identity mismatch: {bad}')
          print(checks)
          PY
          python scripts/verify-no-secrets.py
          python scripts/check_hermes_studio_contract.py --check

      - name: Create or verify v4.2.1 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet refs/tags/v4.2.1; then
            TAG_SHA="$(git rev-list -n1 v4.2.1)"
            test "$TAG_SHA" = "$RELEASE_SHA"
            if gh release view v4.2.1 >/dev/null 2>&1; then
              echo "v4.2.1 already sealed at $RELEASE_SHA"
            else
              gh release create v4.2.1 --verify-tag \
                --title "Hermes Amazon Ads Control v4.2.1 — Sealed Full-Managed Release" \
                --notes-file docs/RELEASE_V4.2.1.md
            fi
          else
            gh release create v4.2.1 --target "$RELEASE_SHA" \
              --title "Hermes Amazon Ads Control v4.2.1 — Sealed Full-Managed Release" \
              --notes-file docs/RELEASE_V4.2.1.md
          fi
