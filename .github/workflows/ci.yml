name: Apply v2.1 source

on:
  push:
    branches:
      - agent/hermes-amazon-ads-autopilot

permissions:
  contents: write

jobs:
  apply-source:
    if: ${{ hashFiles('.bootstrap/hermes-v2.1-source.tar.gz') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/hermes-amazon-ads-autopilot
          fetch-depth: 0
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          echo "99bbdde928219817eead83b1fb9845fdc0a3b9c0594152869592c1b99453a012  .bootstrap/hermes-v2.1-source.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/v21"
          tar -xzf .bootstrap/hermes-v2.1-source.tar.gz -C "$RUNNER_TEMP/v21"
          rsync -a --delete --exclude '.git' --exclude '.github/workflows/ci.yml' "$RUNNER_TEMP/v21/" ./
          rm -rf .bootstrap
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden Amazon Ads autopilot v2.1"
          git push origin HEAD:agent/hermes-amazon-ads-autopilot
