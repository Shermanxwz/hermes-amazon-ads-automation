name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-v2:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/hermes-amazon-ads-autopilot
          fetch-depth: 0

      - name: Verify and extract v2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v2"
          cat .bootstrap/chunk-* > "$RUNNER_TEMP/hermes-v2-source.tar.gz"
          echo "3360e665834b063d56842a08f76901492f312abd0f88d27756671e3887df8ab8  $RUNNER_TEMP/hermes-v2-source.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/hermes-v2-source.tar.gz" -C "$RUNNER_TEMP/v2"
          rsync -a --delete --exclude '.git' "$RUNNER_TEMP/v2/" ./

      - name: Commit v2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply Amazon Ads autopilot v2 source"
          git push origin HEAD:agent/hermes-amazon-ads-autopilot

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: bash scripts/validate.sh
