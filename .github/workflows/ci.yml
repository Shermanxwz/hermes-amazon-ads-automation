name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-coverage:
    name: unit + branch coverage (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install coverage==7.13.3
      - run: bash scripts/coverage.sh
        env:
          COVERAGE_MIN: "80"

  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install ruff==0.12.11 bandit==1.8.6
      - run: bash scripts/quality.sh

  package-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: bash scripts/validate_deploy.sh

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH="$PWD/control-plane:$PWD/hermes-plugin:$PWD/tests" python tests/browser_e2e.py

  stress-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: PYTHONPATH="$PWD/control-plane:$PWD/hermes-plugin:$PWD/tests" python tests/stress_recovery.py

  real-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "hermes-agent==0.18.2"
      - run: PYTHONPATH="$PWD/control-plane" python tests/real_hermes_smoke.py

  amazon-official-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: >-
          python scripts/check_amazon_mcp_contract.py
          --fixture tests/fixtures/amazon_ads_mcp_contract.json
          --check
          --output official/amazon-mcp-contract.ci.json
      - run: >-
          python scripts/sync_official_contracts.py
          --check
          --strict-extended
          --output official/postman-capabilities.ci.json
      - run: >-
          python scripts/check_project_capability_policy.py
          --manifest official/postman-capabilities.ci.json
          --policy official/project-capability-policy.json
          --output official/project-capability-policy.ci.json
      - run: >-
          python scripts/check_official_fingerprint.py
          --manifest official/postman-capabilities.ci.json
          --baseline official/postman-semantic-baseline.json
      - run: python scripts/check_amazon_mcp_reachability.py
