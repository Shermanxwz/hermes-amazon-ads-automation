name: Apply v2.1 hardening patch

on:
  push:
    branches:
      - agent/hermes-amazon-ads-autopilot

permissions:
  contents: write

jobs:
  apply-source:
    if: ${{ hashFiles('.bootstrap/chunk-*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/hermes-amazon-ads-autopilot
          fetch-depth: 0
      - name: Verify and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 -d > "$RUNNER_TEMP/v21.patch.gz"
          echo "9778501b519e9f6fa727b3b07e91291e34183f37d5eda74e9ab6c5dd4c6ca285  $RUNNER_TEMP/v21.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/v21.patch.gz" > "$RUNNER_TEMP/v21.patch"
          git apply --check "$RUNNER_TEMP/v21.patch"
          git apply "$RUNNER_TEMP/v21.patch"
          rm -rf .bootstrap
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden Amazon Ads autopilot v2.1"
          git push origin HEAD:agent/hermes-amazon-ads-autopilot
