name: amazon-ads-control
version: 3.2.0
description: Approval-gated, deterministic and independently verified Amazon Ads full autopilot for Hermes
requires_env:
  - name: ADS_CONTROL_AGENT_TOKEN
    description: Machine token used by Hermes tools and lifecycle hooks
    secret: true
provides_tools:
  - ads_control_sync_catalog
  - ads_control_create_report_job
  - ads_control_report_evidence
  - ads_control_transition_report
  - ads_control_plan_cycle
  - ads_control_create_task
  - ads_control_create_managed_plan
  - ads_control_request_approval
  - ads_control_status
  - ads_control_record_note
  - ads_control_prepare_write
  - ads_control_read_evidence
  - ads_control_verify_decision
  - ads_control_finalize_task
  - ads_control_ingest_stream_events
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
